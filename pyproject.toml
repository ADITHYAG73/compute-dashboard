[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dashboard"]

[project]
name = "compute-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3==1.43.120", "PyYAML==6.0.3", "kaggle==2.2.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "mypy==1.18.2", "types-PyYAML==6.0.12.20250915"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kaggle.*", "kagglesdk.*", "boto3.*", "botocore.*"]
follow_imports = "skip"
